name: Snake PS4 Build

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Baixar OpenOrbis
        run: |
          git clone --depth 1 https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain.git sdk
          echo "OO_PS4_TOOLCHAIN=$GITHUB_WORKSPACE/sdk" >> $GITHUB_ENV

      - name: Verificar SDK
        run: |
          ls sdk
          echo "SDK baixado"

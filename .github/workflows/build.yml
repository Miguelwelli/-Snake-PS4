
name: Snake PS4 Build

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Compilar Snake para PS4
        uses: OpenOrbis/toolchain-action@main
        with:
          version: v0.5.4
          command: |
            set -e

            PROJECT="$(basename "$GITHUB_WORKSPACE")"

            mkdir -p "$PROJECT"
            cp main.cpp "$PROJECT/main.cpp"

            cp "$OO_PS4_TOOLCHAIN/samples/SDL2/Makefile" Makefile
            cp -R "$OO_PS4_TOOLCHAIN/samples/SDL2/sce_sys" .
            cp -R "$OO_PS4_TOOLCHAIN/samples/SDL2/sce_module" .

            sed -i 's/^TITLE[[:space:]]*: =.*/TITLE := Snake PS4/' Makefile
            sed -i 's/^TITLE[[:space:]]*:=.*/TITLE := Snake PS4/' Makefile
            sed -i 's/^TITLE_ID[[:space:]]*:=.*/TITLE_ID := SNAK00001/' Makefile
            sed -i 's/^CONTENT_ID[[:space:]]*:=.*/CONTENT_ID := IV0000-SNAK00001_00-SNAKEGAME000000/' Makefile

            make

      - name: Guardar arquivo PKG
        uses: actions/upload-artifact@v4
        with:
          name: Snake-PS4
          path: "*.pkg"
          if-no-files-found: error
